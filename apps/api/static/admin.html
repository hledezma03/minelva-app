<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Administrativo - Minelva</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>💧 Panel de Administración - Minelva Los Morros</h1>
        <p>Gestión de pedidos y atención al cliente</p>
      </div>

      <div class="toolbar">
        <div></div>
        <div style="display: flex; gap: 10px">
          <button class="btn btn-refresh" onclick="actualizarVistaActiva()">
            🔄 Actualizar
          </button>
          <button class="btn btn-logout" onclick="logout()">
            🚪 Cerrar Sesión
          </button>
        </div>
      </div>

      <div class="tabs">
        <button
          class="tab-btn activo"
          id="tabPedidos"
          onclick="cambiarVista('pedidos')"
        >
          📦 Pedidos
        </button>
        <button
          class="tab-btn"
          id="tabProductos"
          onclick="cambiarVista('productos')"
        >
          🛒 Productos y Precios
        </button>
      </div>

      <div id="vistaPedidos">
        <div class="stats" id="stats"></div>

        <div class="table-container" id="pedidosTable">
          <div class="loading">Cargando pedidos...</div>
        </div>
      </div>

      <div id="vistaProductos" style="display: none">
        <div class="estado-negocio-card">
          <label class="switch">
            <input
              type="checkbox"
              id="switchAbierto"
              checked
              onchange="onCambiarSwitchAbierto()"
            />
            <span class="switch-slider"></span>
          </label>
          <strong id="labelEstadoNegocio">Negocio abierto</strong>
          <input
            type="text"
            id="inputMensajeCierre"
            placeholder="Mensaje para el cliente si está cerrado (ej: Hoy no laboramos por mantenimiento)"
            style="display: none"
          />
          <button class="btn btn-guardar" onclick="guardarEstadoNegocio()">
            💾 Guardar estado
          </button>
        </div>

        <button class="btn btn-agregar" onclick="mostrarFormularioProducto()">
          ➕ Agregar producto
        </button>

        <div id="formProductoContenedor"></div>

        <div class="table-container" id="productosTable">
          <div class="loading">Cargando productos...</div>
        </div>
      </div>
    </div>

    <script src="/static/admin/js/utils.js"></script>
    <script src="/static/admin/js/pedidos.js"></script>
    <script src="/static/admin/js/productos.js"></script>
    <script src="/static/admin/js/negocio.js"></script>
    <script src="/static/admin/js/app.js"></script>
  </body>
</html>
